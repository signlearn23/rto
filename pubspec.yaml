name: rto_exam_app
description: RTO Learning License Exam Preparation App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3
  google_mobile_ads: ^5.1.0
  in_app_purchase: ^3.2.0
  share_plus: ^10.0.2
  url_launcher: ^6.3.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/question_bank/
    - assets/images/
    - assets/animation/
    - assets/images/logo.png     (placeholder, from the same icon)
    - assets/animation/.gitkeep (keeps the empty folder tracked in git)
